[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binder-viz"
version = "0.1.0"
description = "Consolidate, validate and select protein binder designs"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.63", "pandas>=2.0", "numpy>=1.24", "scipy>=1.11",
  "scikit-learn>=1.3", "plotly>=5.18", "pyarrow>=14", "PyYAML>=6",
  "biopython>=1.81",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]